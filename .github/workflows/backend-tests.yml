name: Backend tests

on:
  pull_request:
  push:
    branches:
      - "agent/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        id: tests
        shell: bash
        run: |
          set +e
          python -m pytest backend/tests/test_mvp.py backend/tests/test_autopilot.py backend/tests/test_continuity.py backend/tests/test_layered_memory.py backend/tests/test_story_graph.py backend/tests/test_impact_planning.py backend/tests/test_worldlines.py backend/tests/test_obsidian_export.py backend/tests/test_runtime_reliability.py backend/tests/test_deployment_operations.py backend/tests/test_security_release.py -q --tb=short > pytest-output.txt 2>&1
          status=$?
          cat pytest-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
      - name: Fail when pytest failed
        if: steps.tests.outputs.status != '0'
        run: exit 1
