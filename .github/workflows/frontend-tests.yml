name: Frontend tests

on:
  pull_request:
  push:
    branches:
      - "agent/**"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          npm test 2>&1 | tee frontend-test-output.txt
      - name: Build frontend
        id: build
        continue-on-error: true
        shell: bash
        run: |
          npm run build 2>&1 | tee frontend-build-output.txt
      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-output
          path: |
            frontend/frontend-test-output.txt
            frontend/frontend-build-output.txt
      - name: Fail when frontend validation failed
        if: steps.tests.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
