name: Frontend tests

on:
  pull_request:
  push:
    branches:
      - "agent/**"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        id: tests
        shell: bash
        run: |
          set +e
          npm test > frontend-test-output.txt 2>&1
          status=$?
          cat frontend-test-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build frontend
        id: build
        shell: bash
        run: |
          set +e
          npm run build > frontend-build-output.txt 2>&1
          status=$?
          cat frontend-build-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-output
          path: |
            frontend/frontend-test-output.txt
            frontend/frontend-build-output.txt
      - name: Fail when frontend validation failed
        if: steps.tests.outputs.status != '0' || steps.build.outputs.status != '0'
        run: exit 1
