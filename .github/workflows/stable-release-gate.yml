name: Stable release gate

on:
  pull_request:
  push:
    branches:
      - "agent/stable-release-phase-15"
  workflow_dispatch:

jobs:
  stable-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked application dependencies
        run: |
          test -s backend/requirements.lock
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.lock
          cd frontend
          npm ci
      - name: Verify Python lock is reproducible
        run: |
          python -m pip freeze | LC_ALL=C sort -f > /tmp/requirements.generated.lock
          diff -u backend/requirements.lock /tmp/requirements.generated.lock
      - name: Verify Node lock is immutable
        working-directory: frontend
        run: |
          git diff --exit-code -- package-lock.json
          npm ci
          git diff --exit-code -- package-lock.json
      - name: Verify OpenAPI and SBOM contracts
        run: |
          python scripts/generate_openapi.py --output /tmp/openapi.json
          python scripts/generate_sbom.py \
            --python-lock backend/requirements.lock \
            --node-lock frontend/package-lock.json \
            --output /tmp/sbom.cdx.json \
            --version "$(tr -d '\r\n' < VERSION)"
          diff -u docs/openapi.json /tmp/openapi.json
          diff -u docs/sbom.cdx.json /tmp/sbom.cdx.json
      - name: Scan source for secrets and runtime data
        run: python scripts/scan_secrets.py --output stable-gate/secret-scan.json
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          mkdir -p stable-gate
          pip-audit -r backend/requirements.lock -f json -o stable-gate/pip-audit.json
      - name: Audit Node production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high --json > ../stable-gate/npm-audit.json
      - name: Run stable release preflight
        env:
          SOURCE_DATE_EPOCH: "1700000000"
          AI_NOVEL_BUILD_COMMIT: ${{ github.sha }}
        run: python scripts/release_preflight.py --output release-dist/release-preflight.json
      - name: Copy stable contract artifacts
        run: |
          cp docs/openapi.json release-dist/openapi.json
          cp docs/sbom.cdx.json release-dist/SBOM.cdx.json
          cp stable-gate/*.json release-dist/
      - name: Upload stable release gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-novel-stable-release-gate
          if-no-files-found: warn
          path: |
            release-dist/*-source.zip
            release-dist/*-manifest.json
            release-dist/SHA256SUMS
            release-dist/release-result.json
            release-dist/release-preflight.json
            release-dist/openapi.json
            release-dist/SBOM.cdx.json
            release-dist/pip-audit.json
            release-dist/npm-audit.json
            release-dist/secret-scan.json
