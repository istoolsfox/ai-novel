name: Supply chain bootstrap

on:
  push:
    branches:
      - "agent/stable-release-phase-15"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          cd frontend
          npm ci
      - name: Generate Python lock, OpenAPI, and SBOM
        run: |
          python -m pip freeze | LC_ALL=C sort -f > backend/requirements.lock
          python scripts/generate_openapi.py --output docs/openapi.json
          python scripts/generate_sbom.py \
            --python-lock backend/requirements.lock \
            --node-lock frontend/package-lock.json \
            --output docs/sbom.cdx.json \
            --version "$(tr -d '\r\n' < VERSION)"
          python scripts/scan_secrets.py --output supply-chain/secret-scan.json
      - name: Run Python dependency audit
        id: python_audit
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          mkdir -p supply-chain
          pip-audit -r backend/requirements.lock -f json -o supply-chain/pip-audit.json
      - name: Run Node production dependency audit
        id: node_audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high --json > ../supply-chain/npm-audit.json
      - name: Record audit outcomes
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          Path("supply-chain").mkdir(exist_ok=True)
          result = {
              "python_audit": "${{ steps.python_audit.outcome }}",
              "node_audit": "${{ steps.node_audit.outcome }}",
              "commit": os.environ.get("GITHUB_SHA", ""),
          }
          Path("supply-chain/audit-outcomes.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          PY
      - name: Upload generated supply chain baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-supply-chain-baseline
          path: |
            backend/requirements.lock
            docs/openapi.json
            docs/sbom.cdx.json
            supply-chain/*.json
      - name: Fail on high severity audit findings
        if: steps.python_audit.outcome != 'success' || steps.node_audit.outcome != 'success'
        run: exit 1
