services:
  backend:
    image: ai-novel-backend:${AI_NOVEL_VERSION:-1.0.0-rc.1}
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        APP_VERSION: ${AI_NOVEL_VERSION:-1.0.0-rc.1}
        VCS_REF: ${AI_NOVEL_BUILD_COMMIT:-}
        BUILD_DATE: ${AI_NOVEL_BUILD_DATE:-}
    restart: unless-stopped
    environment:
      AI_NOVEL_DATABASE_URL: sqlite:////data/app.db
      AI_NOVEL_DATA_DIR: /data/projects
      AI_NOVEL_BACKUP_DIR: /data/backups
      AI_NOVEL_VERSION: ${AI_NOVEL_VERSION:-1.0.0-rc.1}
      AI_NOVEL_BUILD_COMMIT: ${AI_NOVEL_BUILD_COMMIT:-}
      AI_NOVEL_BUILD_DATE: ${AI_NOVEL_BUILD_DATE:-}
      AI_NOVEL_RUNTIME_LEASE_SECONDS: ${AI_NOVEL_RUNTIME_LEASE_SECONDS:-90}
      AI_NOVEL_RUNTIME_HEARTBEAT_SECONDS: ${AI_NOVEL_RUNTIME_HEARTBEAT_SECONDS:-10}
      AI_NOVEL_AUTO_MIGRATE: ${AI_NOVEL_AUTO_MIGRATE:-1}
      AI_NOVEL_ADMIN_TOKEN: ${AI_NOVEL_ADMIN_TOKEN:-}
      AI_NOVEL_MASTER_KEY: ${AI_NOVEL_MASTER_KEY:-}
    volumes:
      - ai-novel-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/runtime/health', timeout=5).read()"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  worker:
    image: ai-novel-backend:${AI_NOVEL_VERSION:-1.0.0-rc.1}
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        APP_VERSION: ${AI_NOVEL_VERSION:-1.0.0-rc.1}
        VCS_REF: ${AI_NOVEL_BUILD_COMMIT:-}
        BUILD_DATE: ${AI_NOVEL_BUILD_DATE:-}
    restart: unless-stopped
    command: ["python", "-m", "backend.app.runtime_worker", "--poll-interval", "1"]
    environment:
      AI_NOVEL_DATABASE_URL: sqlite:////data/app.db
      AI_NOVEL_DATA_DIR: /data/projects
      AI_NOVEL_BACKUP_DIR: /data/backups
      AI_NOVEL_VERSION: ${AI_NOVEL_VERSION:-1.0.0-rc.1}
      AI_NOVEL_BUILD_COMMIT: ${AI_NOVEL_BUILD_COMMIT:-}
      AI_NOVEL_BUILD_DATE: ${AI_NOVEL_BUILD_DATE:-}
      AI_NOVEL_RUNTIME_LEASE_SECONDS: ${AI_NOVEL_RUNTIME_LEASE_SECONDS:-90}
      AI_NOVEL_RUNTIME_HEARTBEAT_SECONDS: ${AI_NOVEL_RUNTIME_RUNTIME_HEARTBEAT_SECONDS:-10}
      AI_NOVEL_AUTO_MIGRATE: "0"
      AI_NOVEL_ADMIN_TOKEN: ${AI_NOVEL_ADMIN_TOKEN:-}
      AI_NOVEL_MASTER_KEY: ${AI_NOVEL_MASTER_KEY:-}
    volumes:
      - ai-novel-data:/data
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: ai-novel-frontend:${AI_NOVEL_VERSION:-1.0.0-rc.1}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        APP_VERSION: ${AI_NOVEL_VERSION:-1.0.0-rc.1}
        VCS_REF: ${AI_NOVEL_BUILD_COMMIT:-}
        BUILD_DATE: ${AI_NOVEL_BUILD_DATE:-}
    restart: unless-stopped
    ports:
      - "${AI_NOVEL_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ai-novel-data:
