services:
  - type: web
    name: ai-novel
    runtime: python
    plan: free
    buildCommand: |
      python -m pip install --upgrade pip
      python -m pip install -r backend/requirements.txt
      cd frontend
      npm install
      npm run build
    startCommand: python -m uvicorn backend.app.interfaces.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_NOVEL_DATA_DIR
        value: /tmp/ai-novel-data
      - key: AI_NOVEL_DATABASE_URL
        value: sqlite:////tmp/ai-novel-data/app.db
      - key: AI_NOVEL_MODEL_TIMEOUT_SECONDS
        value: "120"
      - key: AI_NOVEL_GENERATION_TIMEOUT_SECONDS
        value: "900"
